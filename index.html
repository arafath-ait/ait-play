# ait-play
"AIT Hub - Best AI Tools, Scratch Games, Animations, and Web Apps by Arafath"
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT Play - 3D Island Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; }

        /* UI Screens */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; text-align: center;
        }
        #menu-screen h1 { font-size: 2.8rem; color: #ff0055; margin-bottom: 15px; }
        .input-box { margin: 10px; width: 250px; padding: 10px; border-radius: 8px; border: 2px solid #ff0055; background: #222; color: #fff; text-align: center; }
        .btn { padding: 10px 25px; font-size: 1rem; font-weight: bold; background: #ff0055; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        
        .device-selector { display: flex; gap: 10px; margin: 10px 0; }
        .device-btn { padding: 8px 15px; background: #333; border: 2px solid #555; color: white; border-radius: 6px; cursor: pointer; }
        .device-btn.active { border-color: #ff0055; background: #ff0055; }

        /* HUD Overlay */
        #game-hud { position: absolute; top: 10px; left: 10px; z-index: 10; display: none; }
        .hud-card { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 6px; border: 1px solid #444; margin-bottom: 4px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .bar-container { width: 100px; height: 10px; background: #444; border-radius: 5px; overflow: hidden; }
        .health-bar { width: 100%; height: 100%; background: #00e676; transition: width 0.2s; }
        .car-health-bar { width: 100%; height: 100%; background: #ff9800; transition: width 0.2s; }

        /* Red Danger Vignette (Screen Flash on Water/Death) */
        #danger-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.35); pointer-events: none; z-index: 30; display: none;
            animation: flash 0.5s infinite alternate;
        }
        @keyframes flash { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }

        /* Action Buttons */
        #car-enter-btn, #car-exit-btn, #recycle-btn, #phone-toggle-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 20; display: none;
            padding: 12px 20px; background: #ff0055; color: white; font-weight: bold;
            border: 2px solid #fff; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #recycle-btn { bottom: 90px; right: 30px; background: #ff9800; }
        #phone-toggle-btn { bottom: 150px; right: 30px; background: #0088cc; }

        /* Mobile Touch Controls */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 20px; display: none;
            grid-template-columns: repeat(3, 50px); gap: 5px; z-index: 10;
        }
        .touch-btn { width: 50px; height: 50px; background: rgba(255,255,255,0.25); border: 1px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }

        /* In-Game Phone UI */
        #in-game-phone {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 460px; background: #000; border: 8px solid #333; border-radius: 36px;
            z-index: 50; display: none; flex-direction: column; padding: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .phone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; margin-top: 10px; }
        .app-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; margin: 0 auto; cursor: pointer; }
        .app-label { font-size: 0.65rem; margin-top: 4px; color: #ccc; }

        #game-canvas { width: 100%; height: 100%; display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="danger-screen"></div>

    <!-- Menu Screen -->
    <div id="menu-screen">
        <h1>AIT PLAY 3D</h1>
        <p style="margin-bottom: 10px; color: #ccc;">Island City & Car Damage Edition</p>
        <input type="text" id="playerName" class="input-box" placeholder="പേര്..." value="Arafath">
        
        <div class="device-selector">
            <div class="device-btn active" id="dev-laptop" onclick="selectDevice('laptop')">💻 Laptop</div>
            <div class="device-btn" id="dev-mobile" onclick="selectDevice('mobile')">📱 Mobile</div>
        </div>

        <button class="btn" onclick="startGame()">START GAME</button>
    </div>

    <!-- HUD -->
    <div id="game-hud">
        <div class="hud-card">👤 <span id="hud-name">Arafath</span></div>
        <div class="hud-card">
            ❤️ ലൈഫ്: <div class="bar-container"><div id="healthBar" class="health-bar"></div></div>
        </div>
        <div class="hud-card">
            🚗 കാർ ലൈഫ്: <div class="bar-container"><div id="carHealthBar" class="car-health-bar"></div></div>
        </div>
        <div class="hud-card">💵 ₹<span id="money">2000</span></div>
        <div class="hud-card">🍎 ആപ്പിൾ: <span id="apples">0</span></div>
    </div>

    <!-- Buttons -->
    <button id="car-enter-btn" onclick="enterCar()">🚗 കേറാം (Door)</button>
    <button id="car-exit-btn" onclick="exitCar()">🚪 പുറത്തിറങ്ങാം</button>
    <button id="recycle-btn" onclick="recycleCar()">♻️ Recycle/Fix (₹500)</button>
    <button id="phone-toggle-btn" onclick="togglePhone()">📱 ഫോൺ</button>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div></div><div class="touch-btn" id="btn-up">⬆️</div><div></div>
        <div class="touch-btn" id="btn-left">⬅️</div><div class="touch-btn" id="btn-down">⬇️</div><div class="touch-btn" id="btn-right">➡️</div>
    </div>

    <!-- Phone -->
    <div id="in-game-phone">
        <p style="text-align: center; font-size: 0.8rem; color: #888;">AIT OS</p>
        <div class="phone-grid">
            <div><div class="app-icon" style="background: #ff0000;">▶️</div><div class="app-label">YouTube</div></div>
            <div><div class="app-icon" style="background: #e1306c;">📸</div><div class="app-label">Instagram</div></div>
            <div><div class="app-icon" style="background: #4285f4;">🔍</div><div class="app-label">Google</div></div>
        </div>
        <button style="margin-top: auto; background: #333; color: white; border: none; padding: 6px; border-radius: 8px;" onclick="togglePhone()">Close</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        let selectedDevice = 'laptop';
        let scene, camera, renderer, playerGroup, carGroup, leftArm, rightArm, leftLeg, rightLeg;
        let buildings = [], fruits = [];
        let inCar = false, money = 2000, apples = 0, health = 100, carHealth = 100;
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playCrashSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function selectDevice(type) {
            selectedDevice = type;
            document.getElementById('dev-laptop').classList.toggle('active', type === 'laptop');
            document.getElementById('dev-mobile').classList.toggle('active', type === 'mobile');
        }

        function startGame() {
            document.getElementById('hud-name').innerText = document.getElementById('playerName').value || "Player";
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('phone-toggle-btn').style.display = 'block';

            if(selectedDevice === 'mobile') {
                document.getElementById('mobile-controls').style.display = 'grid';
                setupMobileEvents();
            }
            init3DWorld();
        }

        function init3DWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            let light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(30, 50, 30);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // Ocean Floor
            let oceanGeo = new THREE.PlaneGeometry(800, 800);
            let oceanMat = new THREE.MeshLambertMaterial({ color: 0x0055ff });
            let ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -2;
            scene.add(ocean);

            // Island Ground
            let islandGeo = new THREE.CylinderGeometry(120, 130, 2, 32);
            let islandMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            let island = new THREE.Mesh(islandGeo, islandMat);
            island.position.y = -0.9;
            scene.add(island);

            // Roads with Center Lines
            createRoads();

            // Buildings with Windows
            createCityBuildings();

            // Character with Animated Limbs
            createHumanCharacter();

            // Detailed Car
            createDetailedCar();

            // Apples on Island
            for(let i = 0; i < 15; i++) {
                let aGeo = new THREE.SphereGeometry(0.4, 12, 12);
                let aMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                let apple = new THREE.Mesh(aGeo, aMat);
                let angle = Math.random() * Math.PI * 2;
                let rad = Math.random() * 80;
                apple.position.set(Math.cos(angle)*rad, 0.4, Math.sin(angle)*rad);
                scene.add(apple);
                fruits.push(apple);
            }

            window.addEventListener('keydown', e => keys[e.key] = true);
            window.addEventListener('keyup', e => keys[e.key] = false);

            animate();
        }

        function createRoads() {
            let roadMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            let lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            let r1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 200), roadMat);
            r1.rotation.x = -Math.PI / 2; r1.position.y = 0.01; scene.add(r1);

            let r2 = new THREE.Mesh(new THREE.PlaneGeometry(200, 20), roadMat);
            r2.rotation.x = -Math.PI / 2; r2.position.y = 0.01; scene.add(r2);

            // White Road Markings
            for(let i = -90; i <= 90; i += 15) {
                let line1 = new THREE.Mesh(new THREE.PlaneGeometry(1, 6), lineMat);
                line1.rotation.x = -Math.PI / 2; line1.position.set(0, 0.02, i); scene.add(line1);

                let line2 = new THREE.Mesh(new THREE.PlaneGeometry(6, 1), lineMat);
                line2.rotation.x = -Math.PI / 2; line2.position.set(i, 0.02, 0); scene.add(line2);
            }
        }

        function createCityBuildings() {
            let winMat = new THREE.MeshBasicMaterial({ color: 0xffff88 });
            for(let i = -70; i <= 70; i += 35) {
                for(let j = -70; j <= 70; j += 35) {
                    if(Math.abs(i) > 15 || Math.abs(j) > 15) {
                        let h = 15 + Math.random() * 20;
                        let bGeo = new THREE.BoxGeometry(16, h, 16);
                        let bMat = new THREE.MeshLambertMaterial({ color: 0x555566 });
                        let b = new THREE.Mesh(bGeo, bMat);
                        b.position.set(i, h/2, j);
                        scene.add(b);
                        buildings.push(b);

                        // Windows
                        for(let wy = 3; wy < h - 2; wy += 4) {
                            let win = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.5), winMat);
                            win.position.set(i, wy, j + 8.1);
                            scene.add(win);
                        }
                    }
                }
            }
        }

        function createHumanCharacter() {
            playerGroup = new THREE.Group();
            let mat = new THREE.MeshLambertMaterial({ color: 0x0088cc });
            let skinMat = new THREE.MeshLambertMaterial({ color: 0xffcc99 });

            // Body
            let body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), mat);
            body.position.y = 1.2; playerGroup.add(body);

            // Head
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), skinMat);
            head.position.y = 2.0; playerGroup.add(head);

            // Arms & Legs
            let limbGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            leftArm = new THREE.Mesh(limbGeo, skinMat); leftArm.position.set(-0.55, 1.2, 0); playerGroup.add(leftArm);
            rightArm = new THREE.Mesh(limbGeo, skinMat); rightArm.position.set(0.55, 1.2, 0); playerGroup.add(rightArm);

            leftLeg = new THREE.Mesh(limbGeo, mat); leftLeg.position.set(-0.25, 0.4, 0); playerGroup.add(leftLeg);
            rightLeg = new THREE.Mesh(limbGeo, mat); rightLeg.position.set(0.25, 0.4, 0); playerGroup.add(rightLeg);

            playerGroup.position.set(0, 0, 10);
            scene.add(playerGroup);
        }

        function createDetailedCar() {
            carGroup = new THREE.Group();
            let bodyMat = new THREE.MeshLambertMaterial({ color: 0xff0055 });
            let glassMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            let body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4), bodyMat);
            body.position.y = 0.6; carGroup.add(body);

            let roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2), glassMat);
            roof.position.set(0, 1.35, -0.2); carGroup.add(roof);

            let wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            let wMat = new THREE.MeshLambertMaterial({ color: 0x000000 });
            [[-1.2, 0.4, 1.2], [1.2, 0.4, 1.2], [-1.2, 0.4, -1.2], [1.2, 0.4, -1.2]].forEach(pos => {
                let w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI / 2; w.position.set(...pos); carGroup.add(w);
            });

            carGroup.position.set(5, 0, 5);
            scene.add(carGroup);
        }

        function enterCar() {
            inCar = true; playerGroup.visible = false;
            document.getElementById('car-enter-btn').style.display = 'none';
            document.getElementById('car-exit-btn').style.display = 'block';
        }

        function exitCar() {
            inCar = false;
            playerGroup.position.set(carGroup.position.x + 2, 0, carGroup.position.z);
            playerGroup.visible = true;
            document.getElementById('car-exit-btn').style.display = 'none';
        }

        function recycleCar() {
            if(money >= 500) {
                money -= 500; carHealth = 100;
                carGroup.position.set(0, 0, 5);
                carGroup.rotation.set(0, 0, 0);
                carGroup.scale.set(1, 1, 1);
                document.getElementById('money').innerText = money;
                document.getElementById('carHealthBar').style.width = '100%';
                document.getElementById('recycle-btn').style.display = 'none';
            } else {
                alert("കയ്യിൽ ₹500 രൂപ തികച്ചും ഇല്ല!");
            }
        }

        function togglePhone() {
            let p = document.getElementById('in-game-phone');
            p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
        }

        function setupMobileEvents() {
            const bindTouch = (id, key) => {
                let btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            };
            bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
            bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
        }

        let walkTime = 0;
        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.25;
            let target = inCar ? carGroup : playerGroup;

            let isMoving = (keys.ArrowUp || keys.w || keys.ArrowDown || keys.s);

            if (keys.ArrowUp || keys.w) target.translateZ(-speed);
            if (keys.ArrowDown || keys.s) target.translateZ(speed);
            if (keys.ArrowLeft || keys.a) target.rotation.y += 0.04;
            if (keys.ArrowRight || keys.d) target.rotation.y -= 0.04;

            // Character Walking Animation
            if(!inCar && isMoving) {
                walkTime += 0.15;
                leftArm.rotation.x = Math.sin(walkTime) * 0.6;
                rightArm.rotation.x = -Math.sin(walkTime) * 0.6;
                leftLeg.rotation.x = -Math.sin(walkTime) * 0.6;
                rightLeg.rotation.x = Math.sin(walkTime) * 0.6;
            }

            // Building Collision Check for Car
            if(inCar && isMoving) {
                buildings.forEach(b => {
                    if(carGroup.position.distanceTo(b.position) < 10) {
                        carHealth -= 1.5; playCrashSound();
                        carGroup.scale.z = Math.max(0.7, carGroup.scale.z - 0.01); // Crushed/Damaged Car Shape
                        document.getElementById('carHealthBar').style.width = carHealth + '%';
                        if(carHealth < 40) document.getElementById('recycle-btn').style.display = 'block';
                    }
                });
            }

            // Ocean Check (Drowning Danger)
            let distFromCenter = Math.sqrt(target.position.x**2 + target.position.z**2);
            if(distFromCenter > 115) {
                document.getElementById('danger-screen').style.display = 'block';
                health -= 0.3; carHealth -= 0.4;
                document.getElementById('healthBar').style.width = Math.max(0, health) + '%';
                document.getElementById('carHealthBar').style.width = Math.max(0, carHealth) + '%';
                document.getElementById('recycle-btn').style.display = 'block';
            } else {
                document.getElementById('danger-screen').style.display = 'none';
            }

            // Door Button Check
            if(!inCar) {
                let dist = playerGroup.position.distanceTo(carGroup.position);
                document.getElementById('car-enter-btn').style.display = (dist < 3.5) ? 'block' : 'none';

                fruits.forEach((apple, idx) => {
                    if(playerGroup.position.distanceTo(apple.position) < 1.2) {
                        scene.remove(apple); fruits.splice(idx, 1);
                        apples++; document.getElementById('apples').innerText = apples;
                    }
                });
            }

            // Camera Follow
            let camOffset = new THREE.Vector3(0, 4, 8).applyMatrix4(target.matrixWorld);
            camera.position.lerp(camOffset, 0.1);
            camera.lookAt(target.position);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
