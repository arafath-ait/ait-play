<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Official Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: #0b0f17;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    header {
      background: #161e2e;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #243044;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* Secret 3-second Long Press AIT Logo */
    .ait-logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      background: #0b0f17;
      padding: 6px 16px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
      transition: transform 0.2s;
    }
    .ait-logo:active {
      transform: scale(0.95);
    }

    /* Search Bar Area */
    .search-box {
      flex: 1;
      max-width: 360px;
      margin: 0 15px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      background: #0b0f17;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: #38bdf8;
    }

    /* Request Button */
    .req-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .req-btn:hover {
      background: #059669;
    }

    /* Games Container */
    .container {
      padding: 24px 20px;
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      color: #94a3b8;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: #161e2e;
      border: 1px solid #243044;
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .game-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .game-title {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      word-break: break-word;
    }

    /* Request Game Idea Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-box {
      background: #161e2e;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #243044;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-box h3 {
      margin-bottom: 12px;
      color: #38bdf8;
      font-size: 18px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b0f17;
      color: #fff;
      font-size: 14px;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #38bdf8;
    }

    .action-btn {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .action-btn:hover {
      background: #1d4ed8;
    }

    /* Fullscreen Game Play Window */
    .game-window {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 3000;
      flex-direction: column;
    }

    .game-bar {
      height: 48px;
      background: #161e2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #243044;
    }

    iframe {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <!-- Hold for 3 Seconds to Redirect to Admin Login Website -->
    <div class="ait-logo" id="aitLogo">AIT</div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search games..." oninput="searchGames()">
    </div>

    <button class="req-btn" onclick="openRequestModal()"> Publish Game</button>
  </header>

  <!-- Published Games Grid -->
  <div class="container">
    <div class="section-title">Published Games</div>
    <div class="games-grid" id="gamesGrid">
      <!-- Games load dynamically here -->
    </div>
  </div>

  <!-- User Game Idea Request Modal -->
  <div class="modal" id="requestModal">
    <div class="modal-box">
      <h3>Submit Game Idea</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">നിങ്ങളുടെ പുതിയ ഗെയിം ഐഡിയ ഇവിടെ നൽകാം:</p>
      <textarea id="ideaText" rows="4" placeholder="Describe your game idea..."></textarea>
      <button class="action-btn" onclick="submitGameIdea()">Submit Request</button>
      <button class="action-btn" style="background:#dc2626; margin-top:8px;" onclick="closeModal('requestModal')">Cancel</button>
    </div>
  </div>

  <!-- Game Play Fullscreen Window -->
  <div class="game-window" id="gameWindow">
    <div class="game-bar">
      <span id="playingGameTitle" style="font-weight: 600; color: #38bdf8;">Game Title</span>
      <button style="background:#dc2626; color:white; border:none; padding:6px 14px; border-radius:12px; font-weight:600; cursor:pointer;" onclick="closeGame()">✕ Close</button>
    </div>
    <iframe id="gameFrame"></iframe>
  </div>

  <script>
    // Local Data Storage Sync
    let publishedGames = JSON.parse(localStorage.getItem('ait_published_games')) || [
      {
        id: 1,
        title: "Drama Voice Challenge",
        code: `<!DOCTYPE html><html><body style="background:#0b0f17;color:#38bdf8;text-align:center;padding:50px;font-family:sans-serif;"><h2>🎭 Drama Voice Challenge Game</h2></body></html>`
      }
    ];

    let gameRequests = JSON.parse(localStorage.getItem('ait_game_requests')) || [];

    // Render Store Games
    function renderGamesList(listToRender = publishedGames) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      if (listToRender.length === 0) {
        grid.innerHTML = `<p style="color:#64748b; grid-column: 1/-1;">No games found!</p>`;
        return;
      }

      listToRender.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => playGame(game);
        card.innerHTML = `
          <div class="game-icon">🎮</div>
          <div class="game-title">${game.title}</div>
        `;
        grid.appendChild(card);
      });
    }
    renderGamesList();

    // Secret 3-second Long Press on AIT Logo -> Redirects to Admin Login Site
    let pressTimer;
    const aitLogo = document.getElementById('aitLogo');

    aitLogo.addEventListener('mousedown', startPress);
    aitLogo.addEventListener('touchstart', startPress);
    aitLogo.addEventListener('mouseup', cancelPress);
    aitLogo.addEventListener('touchend', cancelPress);

    function startPress() {
      pressTimer = setTimeout(() => {
        window.location.href = "https://arafath-ait.github.io/login-website/";
      }, 3000);
    }

    function cancelPress() {
      clearTimeout(pressTimer);
    }

    // Modal Handling
    function openRequestModal() { document.getElementById('requestModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function submitGameIdea() {
      const idea = document.getElementById('ideaText').value.trim();
      if (!idea) {
        alert("Please enter your idea!");
        return;
      }

      gameRequests.push({ id: Date.now(), idea });
      localStorage.setItem('ait_game_requests', JSON.stringify(gameRequests));

      document.getElementById('ideaText').value = '';
      closeModal('requestModal');
      alert("Successfully Requested!");
    }

    // Search Filtering
    function searchGames() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = publishedGames.filter(g => g.title.toLowerCase().includes(q));
      renderGamesList(filtered);
    }

    // Fullscreen Play Game
    function playGame(game) {
      document.getElementById('playingGameTitle').innerText = game.title;
      const iframe = document.getElementById('gameFrame');
      document.getElementById('gameWindow').style.display = 'flex';

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(game.code);
      doc.close();
    }

    function closeGame() {
      document.getElementById('gameWindow').style.display = 'none';
      document.getElementById('gameFrame').src = 'about:blank';
    }
  </script>
</body>
</html>
