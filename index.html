<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Analytics Tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCB4FLWWTK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-ZCB4FLWWTK');
  </script>

  <!-- Google Search Console Verification Tag -->
  <meta name="google-site-verification" content="BC72PoBTqX5w4xESU5r_xAYm2DoteZywncXXioMaHjA" />
  
  <title>AIT Play - Free Online Games</title>
  <meta name="description" content="Play free online games on AIT Play. Created by AIT.">
  <meta name="theme-color" content="#0f172a">

  <!-- PWA Web App Manifest (For App Installation) -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22AIT%20Play%22,%22short_name%22:%22AIT%20Play%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }
    body.light-theme {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #0284c7;
      --border-color: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 50px; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: var(--card-bg); border-bottom: 2px solid var(--border-color);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent-color); cursor: pointer; user-select: none; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .bulb-btn { font-size: 22px; cursor: pointer; background: none; border: none; color: #94a3b8; padding: 5px; }
    .bulb-btn.active { color: #facc15; filter: drop-shadow(0 0 8px #facc15); }
    .install-btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }
    .req-btn { background: #22c55e; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    .controls-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .search-box { width: 100%; padding: 12px 18px; border-radius: 25px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 16px; outline: none; }
    
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .game-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .game-icon { font-size: 40px; color: var(--accent-color); margin-bottom: 10px; }
    .game-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; word-break: break-word; }
    .play-btn { background: var(--accent-color); color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; position: relative; }
    .game-player-content { background: var(--card-bg); width: 95%; height: 90vh; max-width: 800px; border-radius: 12px; position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: var(--text-color); z-index: 10; }
    .modal-content input, .modal-content textarea { width: 100%; margin: 10px 0; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
    #gameFrame { width: 100%; height: 100%; border: none; background: #ffffff; }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="adminLogo">AIT PLAY</div>
    <div class="header-actions">
      <button class="install-btn" id="installBtn">📲 Install App</button>
      <button class="bulb-btn" id="themeBtn" title="Toggle Theme"><i class="fa-solid fa-lightbulb"></i></button>
      <button class="req-btn" id="openReqModal">+ Idea</button>
    </div>
  </header>

  <div class="controls-container">
    <input type="text" class="search-box" id="searchBox" placeholder="Search Games...">
  </div>

  <main class="games-grid" id="gamesContainer"></main>

  <div class="modal" id="reqModal">
    <div class="modal-content">
      <span class="close-btn" id="closeReqModal">&times;</span>
      <h3>Request A Game Idea 🚀</h3>
      <input type="text" id="reqName" placeholder="Your Name">
      <textarea id="reqIdea" rows="4" placeholder="Describe the game idea..."></textarea>
      <button class="req-btn" style="width: 100%;" id="submitReq">Submit Idea</button>
    </div>
  </div>

  <div class="modal" id="gameModal">
    <div class="game-player-content">
      <span class="close-btn" id="closeGameModal">&times;</span>
      <iframe id="gameFrame" src="about:blank"></iframe>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Theme Toggle
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      themeBtn.classList.toggle('active');
    });

    // Secret Long Press for Admin Panel Navigation
    const adminLogo = document.getElementById('adminLogo');
    let pressTimer;
    adminLogo.addEventListener('touchstart', startPress);
    adminLogo.addEventListener('mousedown', startPress);
    adminLogo.addEventListener('touchend', cancelPress);
    adminLogo.addEventListener('mouseup', cancelPress);

    function startPress() {
      pressTimer = setTimeout(() => {
        window.location.href = "https://arafath-ait.github.io/login-website/";
      }, 3000);
    }
    function cancelPress() { clearTimeout(pressTimer); }

    // Request Modal & Submitting Loading Logic
    const reqModal = document.getElementById('reqModal');
    const submitReqBtn = document.getElementById('submitReq');

    document.getElementById('openReqModal').onclick = () => reqModal.style.display = 'flex';
    document.getElementById('closeReqModal').onclick = () => reqModal.style.display = 'none';

    submitReqBtn.onclick = () => {
      const name = document.getElementById('reqName').value.trim();
      const idea = document.getElementById('reqIdea').value.trim();

      if(name && idea) {
        // Show Loading State & Disable Button
        submitReqBtn.innerText = "⏳ Submitting Idea...";
        submitReqBtn.disabled = true;

        db.collection("requests").add({
          name: name,
          idea: idea,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          alert("Successfully Requested! 🚀");
          reqModal.style.display = 'none';
          document.getElementById('reqName').value = '';
          document.getElementById('reqIdea').value = '';
        }).catch((err) => {
          alert("Error sending request, please try again!");
        }).finally(() => {
          // Reset Button Back to Original
          submitReqBtn.innerText = "Submit Idea";
          submitReqBtn.disabled = false;
        });
      } else {
        alert("Please fill all fields!");
      }
    };

    // Load Games from Database Safely
    const gamesContainer = document.getElementById('gamesContainer');
    let gamesList = [];

    db.collection("published_games").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
      gamesContainer.innerHTML = '';
      gamesList = [];
      snapshot.forEach((doc) => {
        const game = doc.data();
        game.id = doc.id;
        gamesList.push(game);

        const gameCard = document.createElement('div');
        gameCard.className = 'game-card';
        gameCard.innerHTML = `
          <i class="fa-solid fa-gamepad game-icon"></i>
          <div class="game-title">${game.title}</div>
          <button class="play-btn" onclick="openGame('${doc.id}')">Play Now</button>
        `;
        gamesContainer.appendChild(gameCard);
      });
    });

    // Search Logic
    document.getElementById('searchBox').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const title = card.querySelector('.game-title').innerText.toLowerCase();
        card.style.display = title.includes(query) ? 'flex' : 'none';
      });
    });

    // Game Player Frame Logic
    const gameModal = document.getElementById('gameModal');
    const gameFrame = document.getElementById('gameFrame');
    document.getElementById('closeGameModal').onclick = () => {
      gameModal.style.display = 'none';
      gameFrame.src = 'about:blank';
    };

    function openGame(id) {
      const selectedGame = gamesList.find(g => g.id === id);
      if(selectedGame) {
        gameModal.style.display = 'flex';
        const doc = gameFrame.contentWindow.document;
        doc.open();
        doc.write(selectedGame.code);
        doc.close();
      }
    }

    // App Installation Logic (PWA)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
