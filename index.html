<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT Cloud Platform & Social Network</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #062033);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #f8fafc; padding-bottom: 60px; user-select: none; min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Fullscreen Welcome Screen */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .intro-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 24px; padding: 26px; max-width: 380px; width: 100%;
            border: 2px solid #ec4899; box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); text-align: center;
        }
        .intro-card h1 { 
            font-size: 2rem; background: linear-gradient(90deg, #38bdf8, #ec4899, #eab308);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; font-weight: 900;
        }

        .auth-toggle { display: flex; background: #0f172a; border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: bold; cursor: pointer; border-radius: 10px; }
        .tab-btn.active { background: linear-gradient(90deg, #0284c7, #2563eb); color: white; }

        .input-field {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #475569;
            background: #0f172a; color: white; outline: none; font-size: 0.9rem; margin-bottom: 12px;
        }

        .action-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, #ec4899, #8b5cf6); color: white; font-weight: bold; cursor: pointer;
            font-size: 0.95rem; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }
        .action-btn:active { transform: scale(0.96); }

        /* Header & Navigation */
        header {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #8b5cf6;
        }
        .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Navigation Tabs: Games vs Accounts */
        .nav-tabs { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .nav-tab-btn {
            padding: 8px 20px; border-radius: 20px; border: 1px solid #8b5cf6;
            background: #1e293b; color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .nav-tab-btn.active { background: linear-gradient(90deg, #ec4899, #8b5cf6); }

        .search-box {
            width: 90%; max-width: 400px; display: block; margin: 0 auto 15px auto;
            padding: 10px 16px; border-radius: 20px; border: 1px solid #8b5cf6; background: #1e293b; color: white; outline: none;
        }

        /* Accounts & Games Grid */
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 0 16px; }
        .card-item {
            background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 16px; padding: 14px;
            display: flex; gap: 12px; align-items: center; border: 1px solid #334155;
        }

        /* Modals */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 500; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 380px; border-radius: 20px; padding: 22px;
            border: 2px solid #8b5cf6; position: relative; max-height: 85vh; overflow-y: auto;
        }
        .close-btn { background: none; border: none; color: #f43f5e; font-size: 1.4rem; cursor: pointer; font-weight: bold; float: right; }

        .chat-box { height: 200px; background: #0f172a; border-radius: 10px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #334155; }
        .msg-item { background: #1e293b; padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Onboarding Screen -->
    <div id="welcome-screen">
        <div class="intro-card">
            <h1>AIT Social & Games</h1>
            <p>ലോഗിൻ ചെയ്ത് സൗജന്യമായി കളിക്കൂ, കൂട്ടുകാരുമായി ചാറ്റ് ചെയ്യൂ!</p>

            <div class="auth-toggle">
                <button class="tab-btn active" id="tab-signin" onclick="playClick(); switchAuthTab('signin');">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="playClick(); switchAuthTab('signup');">Sign Up</button>
            </div>

            <!-- Sign In Box -->
            <div id="box-signin">
                <input type="text" id="login-name" class="input-field" placeholder="Username / പേര്...">
                <input type="password" id="login-pass" class="input-field" maxlength="6" placeholder="6 അക്ക പാസ്‌വേഡ്...">
                <button class="action-btn" onclick="playClick(); handleLogin();">Sign In & Play</button>
            </div>

            <!-- Sign Up Box -->
            <div id="box-signup" style="display: none;">
                <input type="text" id="reg-name" class="input-field" placeholder="ഇഷ്ടമുള്ള പേര് അടിക്കുക...">
                <input type="password" id="reg-pass" class="input-field" maxlength="6" placeholder="ഇഷ്ടമുള്ള 6 അക്ക പാസ്‌വേഡ്...">
                <button class="action-btn" style="background: linear-gradient(90deg, #10b981, #059669);" onclick="playClick(); handleRegister();">Create Account</button>
            </div>

            <button class="action-btn" style="background:#475569; margin-top:10px;" onclick="playClick(); continueAsGuest();">👀 Guest Play (തൽക്കാലം ലോഗിൻ വേണ്ട)</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">AIT <span>PLATFORM</span></div>
        <div>
            <button class="action-btn" style="padding: 6px 12px; font-size:0.8rem;" onclick="playClick(); openModal('settings-modal');">⚙️ Settings</button>
        </div>
    </header>

    <!-- Games vs Accounts Navigation -->
    <div class="nav-tabs">
        <button class="nav-tab-btn active" id="btn-tab-games" onclick="playClick(); switchNav('games');">🎮 Games</button>
        <button class="nav-tab-btn" id="btn-tab-accounts" onclick="playClick(); switchNav('accounts');">👥 Accounts (Instagram Style)</button>
    </div>

    <input type="text" id="main-search" class="search-box" placeholder="Search Games or Friends..." oninput="handleSearch()">

    <!-- Main List Container -->
    <div class="list-grid" id="main-list-container"></div>

    <!-- Direct Chat Modal -->
    <div id="chat-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('chat-modal')">✕</button>
            <h3 id="chat-user-title" style="color:#38bdf8; margin-bottom:10px;">Chat</h3>
            <div class="chat-box" id="chat-messages"></div>
            <input type="text" id="chat-input" class="input-field" placeholder="സന്ദേശം ടൈപ്പ് ചെയ്യുക...">
            <button class="action-btn" onclick="sendDirectMessage()">Send Message</button>
        </div>
    </div>

    <!-- Settings & Add Group Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('settings-modal')">✕</button>
            <h3>Settings</h3>
            <hr style="border-color:#334155; margin:15px 0;">
            <h4 style="color:#ec4899; margin-bottom:8px;">➕ Add Group</h4>
            <input type="text" id="group-name-input" class="input-field" placeholder="ഗ്രൂപ്പിന്റെ പേര്...">
            <input type="text" id="group-member-input" class="input-field" placeholder="ചേർക്കേണ്ട സുഹൃത്തിന്റെ Username...">
            <button class="action-btn" style="background: linear-gradient(90deg, #10b981, #059669);" onclick="createGroup()">Create & Join Group</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('admin-modal')">✕</button>
            <h2 style="color:#f43f5e; margin-bottom:10px;">🔑 Ultra-Secret Admin Panel</h2>
            <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:15px;">എല്ലാ ഉപയോക്താക്കളുടെയും അക്കൗണ്ടുകൾ ഇവിടെ കാണാം:</p>
            <div id="admin-all-users" style="font-size:0.85rem;"></div>
        </div>
    </div>

    <script>
        // Web Audio Synth Sound Effect
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClick() {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
            authDomain: "ait-game-store.firebaseapp.com",
            projectId: "ait-game-store",
            databaseURL: "https://ait-game-store-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let activeNav = 'games';
        let allUsersData = {};
        let activeChatFriend = "";

        function switchAuthTab(type) {
            if(type === 'signin') {
                document.getElementById('tab-signin').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
                document.getElementById('box-signin').style.display = 'block';
                document.getElementById('box-signup').style.display = 'none';
            } else {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-signin').classList.remove('active');
                document.getElementById('box-signup').style.display = 'block';
                document.getElementById('box-signin').style.display = 'none';
            }
        }

        function handleRegister() {
            let name = document.getElementById('reg-name').value.trim();
            let pass = document.getElementById('reg-pass').value.trim();
            if(!name || pass.length !== 6) { alert("ഇഷ്ടമുള്ള പേരും 6 അക്ക പാസ്‌വേഡും നൽകുക!"); return; }

            db.ref('users/' + name).set({ name: name, pin: pass, followers: 0 }, (err) => {
                if(!err) { alert("അക്കൗണ്ട് വിജയകരമായി ഉണ്ടാക്കി! ഇനി Sign In ചെയ്യുക."); switchAuthTab('signin'); }
            });
        }

        function handleLogin() {
            let name = document.getElementById('login-name').value.trim();
            let pass = document.getElementById('login-pass').value.trim();

            // Ultra-Secret Admin Entry Condition
            if(name === "AIT" && pass === "2012") {
                currentUser = { name: "AIT Admin" };
                document.getElementById('welcome-screen').style.display = 'none';
                openAdminPanel();
                return;
            }

            db.ref('users/' + name).once('value').then(snap => {
                if(snap.exists() && snap.val().pin === pass) {
                    currentUser = snap.val();
                    document.getElementById('welcome-screen').style.display = 'none';
                    loadInitialData();
                } else {
                    alert("തെറ്റായ Username അല്ലെങ്കിൽ പാസ്‌വേഡ്!");
                }
            });
        }

        function continueAsGuest() {
            currentUser = { name: "Guest" };
            document.getElementById('welcome-screen').style.display = 'none';
            loadInitialData();
        }

        function switchNav(type) {
            activeNav = type;
            if(type === 'games') {
                document.getElementById('btn-tab-games').classList.add('active');
                document.getElementById('btn-tab-accounts').classList.remove('active');
            } else {
                document.getElementById('btn-tab-accounts').classList.add('active');
                document.getElementById('btn-tab-games').classList.remove('active');
            }
            handleSearch();
        }

        function loadInitialData() {
            db.ref('users').on('value', snap => {
                allUsersData = snap.val() || {};
                if(activeNav === 'accounts') renderAccounts(allUsersData);
            });
            renderGames();
        }

        function handleSearch() {
            let q = document.getElementById('main-search').value.toLowerCase();
            if(activeNav === 'games') {
                renderGames();
            } else {
                let filtered = {};
                Object.keys(allUsersData).forEach(u => {
                    if(u.toLowerCase().includes(q)) filtered[u] = allUsersData[u];
                });
                renderAccounts(filtered);
            }
        }

        function renderGames() {
            let container = document.getElementById('main-list-container');
            container.innerHTML = `
                <div class="card-item">
                    <div style="font-size:2rem;">🎮</div>
                    <div>
                        <strong>Sample Cloud Game</strong>
                        <p style="font-size:0.75rem; color:#94a3b8;">HTML5 Instant Game</p>
                    </div>
                </div>
            `;
        }

        function renderAccounts(usersObj) {
            let container = document.getElementById('main-list-container');
            container.innerHTML = '';

            Object.keys(usersObj).forEach(u => {
                if(u === "AIT") return; // Admin hide
                let card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div style="font-size:2rem;">👤</div>
                    <div style="flex-grow:1;">
                        <strong>${u}</strong>
                        <p style="font-size:0.75rem; color:#38bdf8;">Followers: ${usersObj[u].followers || 0}</p>
                    </div>
                    <button class="action-btn" style="width:auto; padding:6px 10px; font-size:0.75rem;" onclick="openChat('${u}')">Message</button>
                `;
                container.appendChild(card);
            });
        }

        function openChat(friendName) {
            if(!currentUser || currentUser.name === "Guest") { alert("മെസ്സേജ് അയക്കാൻ ലോഗിൻ ചെയ്യുക!"); return; }
            activeChatFriend = friendName;
            document.getElementById('chat-user-title').innerText = "Chat with " + friendName;
            openModal('chat-modal');

            // Listen to messages
            db.ref('chats/' + getChatRoomId(currentUser.name, friendName)).on('value', snap => {
                let msgs = snap.val();
                let box = document.getElementById('chat-messages');
                box.innerHTML = '';
                if(msgs) {
                    Object.keys(msgs).forEach(k => {
                        box.innerHTML += `<div class="msg-item"><strong>${msgs[k].sender}:</strong> ${msgs[k].text}</div>`;
                    });
                }
            });
        }

        function sendDirectMessage() {
            let txt = document.getElementById('chat-input').value.trim();
            if(!txt) return;

            let roomId = getChatRoomId(currentUser.name, activeChatFriend);
            db.ref('chats/' + roomId).push({
                sender: currentUser.name,
                text: txt
            });
            document.getElementById('chat-input').value = '';
        }

        function getChatRoomId(user1, user2) {
            return [user1, user2].sort().join("_");
        }

        function createGroup() {
            let gName = document.getElementById('group-name-input').value;
            let mName = document.getElementById('group-member-input').value;

            if(!gName || !mName) { alert("ഗ്രൂപ്പിന്റെ പേരും ചേർക്കേണ്ട ആളുടെ പേരും നൽകുക!"); return; }

            db.ref('groups/' + gName).set({
                createdByUser: currentUser.name,
                members: [currentUser.name, mName]
            });
            alert("ഗ്രൂപ്പ് ഉണ്ടാക്കി! അംഗങ്ങൾ ജോയിൻ ആയി.");
            closeModal('settings-modal');
        }

        function openAdminPanel() {
            openModal('admin-modal');
            db.ref('users').once('value', snap => {
                let u = snap.val();
                let box = document.getElementById('admin-all-users');
                box.innerHTML = '';
                if(u) {
                    Object.keys(u).forEach(k => {
                        box.innerHTML += `<div style="background:#0f172a; padding:8px; margin-bottom:5px; border-radius:6px;">
                            👤 Username: <strong>${k}</strong> | PIN: <strong>${u[k].pin}</strong>
                        </div>`;
                    });
                }
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
