<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT Game Store</title>
    <!-- Manifest for Installing to Home Screen -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkFJVCBHYW1lIFN0b3JlIiwKICAic2hvcnRfbmFtZSI6ICJBSVQgU3RvcmUiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBmMTcyYSIsCiAgInRoZW1lX2NvbG9yIjogIiMwMjg0YzciCn0=">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen font-sans pb-10">

    <!-- Header / Navbar -->
    <nav class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center px-6 sticky top-0 z-50">
        <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">🎮 AIT Game Store</h1>
        
        <div class="flex items-center gap-3">
            <!-- Install App Button -->
            <button id="install-btn" onclick="installPWA()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg">📲 Install App</button>

            <!-- User Actions -->
            <div id="user-nav-actions" class="flex gap-2">
                <a href="https://arafath-ait.github.io/login-website/" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-2 rounded-lg">🔑 Login / Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-200">ട്രെൻഡിംഗ് ഗെയിമുകൾ</h2>
            <button onclick="openModal('settings-modal')" class="bg-slate-800 border border-slate-700 text-slate-300 hover:text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">⚙️ സെറ്റിംഗ്സ് / പ്രൊഫൈൽ</button>
        </div>

        <!-- Games Grid -->
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="text-slate-400 col-span-full text-center py-10">ഗെയിമുകൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- Settings & Account Modal -->
    <div id="settings-modal" class="modal p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('settings-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
            
            <h3 class="text-xl font-bold text-cyan-400 mb-4">⚙️ അക്കൗണ്ട് സെറ്റിംഗ്സ്</h3>
            
            <!-- User Info -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/50 mb-6">
                <p class="text-xs text-slate-400">ലോഗിൻ വിവരങ്ങൾ</p>
                <p class="text-sm mt-1"><strong>പേര്:</strong> <span id="user-display-name">Guest User</span></p>
                <p class="text-sm mt-1"><strong>PIN / പാസ്‌വേഡ്:</strong> <span id="user-display-pin">******</span></p>
            </div>

            <!-- Published Games & Stats -->
            <h4 class="font-bold text-slate-200 mb-2 text-sm">നിങ്ങൾ പബ്ലിഷ് ചെയ്ത ഗെയിമുകൾ</h4>
            <div id="my-published-games" class="space-y-2 mb-6">
                <p class="text-xs text-slate-500">ഗെയിമുകൾ ഒന്നും പബ്ലിഷ് ചെയ്തിട്ടില്ല.</p>
            </div>

            <!-- Publish Game Form -->
            <div class="border-t border-slate-700 pt-4">
                <h4 class="font-bold text-cyan-400 mb-3 text-sm">🚀 പുതിയ ഗെയിം പബ്ലിഷ് ചെയ്യാം</h4>
                <input type="text" id="pub-title" placeholder="ഗെയിമിന്റെ പേര്..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white mb-3 focus:outline-none focus:border-cyan-500">
                <textarea id="pub-code" rows="4" placeholder="ഗെയിം HTML/JS കോഡ് പേസ്റ്റ് ചെയ്യുക..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white mb-3 focus:outline-none focus:border-cyan-500 font-mono text-xs"></textarea>
                <button onclick="publishNewGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition">Publish Game</button>
            </div>
        </div>
    </div>

    <!-- Game Player Modal -->
    <div id="player-modal" class="modal p-2">
        <div class="bg-slate-900 w-full max-w-4xl h-[90vh] rounded-2xl border border-slate-700 flex flex-col overflow-hidden relative">
            <div class="bg-slate-800 p-3 border-b border-slate-700 flex justify-between items-center">
                <span id="playing-title" class="font-bold text-sm text-cyan-400">Game</span>
                <button onclick="closeGamePlayer()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1 rounded-lg text-xs font-bold">Exit</button>
            </div>
            <iframe id="game-iframe" class="w-full flex-grow border-0"></iframe>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
            authDomain: "ait-game-store.firebaseapp.com",
            databaseURL: "https://ait-game-store-default-rtdb.firebaseio.com",
            projectId: "ait-game-store",
            storageBucket: "ait-game-store.firebasestorage.app",
            messagingSenderId: "146438462272",
            appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let deferredPrompt;
        let currentUser = localStorage.getItem('ait_user') ? JSON.parse(localStorage.getItem('ait_user')) : { name: "Guest", pin: "******" };

        // Load Saved User Details
        document.getElementById('user-display-name').innerText = currentUser.name;
        document.getElementById('user-display-pin').innerText = currentUser.pin;

        // PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('install-btn').classList.add('hidden');
                });
            }
        }

        // Modals
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // Fetch & Display Games
        db.ref('games').on('value', snapshot => {
            const grid = document.getElementById('games-grid');
            const myGamesContainer = document.getElementById('my-published-games');
            grid.innerHTML = '';
            myGamesContainer.innerHTML = '';

            if(!snapshot.exists()) {
                grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-10">ഇതുവരെ ഗെയിമുകൾ അപ്‌ലോഡ് ചെയ്തിട്ടില്ല.</p>';
                return;
            }

            let hasMyGames = false;

            snapshot.forEach(child => {
                const g = child.val();
                const id = child.key;

                // Main Store Cards
                grid.innerHTML += `
                    <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700/80 flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="text-3xl mb-2">🎮</div>
                            <h3 class="font-bold text-lg text-cyan-300 mb-1">${g.title}</h3>
                            <p class="text-xs text-slate-400 mb-3">By ${g.author || 'Anonymous'}</p>
                        </div>

                        <div class="flex items-center justify-between text-xs text-slate-400 mb-4 border-t border-slate-700/50 pt-3">
                            <span>👀 ${g.views || 0} Views</span>
                            <span>❤️ ${g.likes || 0} Likes</span>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="playGame('${id}')" class="flex-grow bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">▶ കളിക്കുക</button>
                            <button onclick="likeGame('${id}', ${g.likes || 0})" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl text-xs transition">❤️</button>
                        </div>
                    </div>
                `;

                // My Published Games List in Settings
                if(g.author === currentUser.name) {
                    hasMyGames = true;
                    myGamesContainer.innerHTML += `
                        <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700/50 flex justify-between items-center text-xs">
                            <span class="font-bold text-slate-300">${g.title}</span>
                            <span class="text-slate-400">👀 ${g.views || 0} | ❤️ ${g.likes || 0}</span>
                        </div>
                    `;
                }
            });

            if(!hasMyGames) {
                myGamesContainer.innerHTML = '<p class="text-xs text-slate-500">നിങ്ങൾ ഗെയിമുകൾ ഒന്നും പബ്ലിഷ് ചെയ്തിട്ടില്ല.</p>';
            }
        });

        // Play Game & Update Views
        function playGame(id) {
            db.ref('games/' + id).once('value', snapshot => {
                const g = snapshot.val();
                if(g) {
                    // Update Views Count
                    db.ref('games/' + id).update({ views: (g.views || 0) + 1 });

                    document.getElementById('playing-title').innerText = g.title;
                    const iframe = document.getElementById('game-iframe');
                    iframe.srcdoc = g.code;
                    openModal('player-modal');
                }
            });
        }

        function closeGamePlayer() {
            document.getElementById('game-iframe').srcdoc = '';
            closeModal('player-modal');
        }

        // Like Game
        function likeGame(id, currentLikes) {
            db.ref('games/' + id).update({ likes: currentLikes + 1 });
        }

        // Publish Game
        function publishNewGame() {
            const title = document.getElementById('pub-title').value.trim();
            const code = document.getElementById('pub-code').value.trim();

            if(!title || !code) {
                alert("ദയവായി പേരും ഗെയിം കോഡും നൽകുക!");
                return;
            }

            const newGameRef = db.ref('games').push();
            newGameRef.set({
                title: title,
                code: code,
                author: currentUser.name,
                views: 0,
                likes: 0,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('pub-title').value = '';
                document.getElementById('pub-code').value = '';
                closeModal('settings-modal');
                alert("ഗെയിം വിജയകരമായി പബ്ലിഷ് ചെയ്തു!");
            });
        }
    </script>
</body>
</html>
