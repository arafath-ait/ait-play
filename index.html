<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Online Games Hub</title>
  
  <!-- Manifest link for Web App Installation -->
  <link rel="manifest" href="data:application/manifest+json,{'name':'AIT Play','short_name':'AIT Play','start_url':'/','display':'standalone','background_color':'#0f172a','theme_color':'#38bdf8'}">

  <!-- Google Analytics Tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCB4FLWWTK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZCB4FLWWTK');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
    
    header { text-align: center; margin-top: 15px; margin-bottom: 25px; }
    header h1 { color: #38bdf8; font-size: 2.2rem; font-weight: 800; }
    header p { color: #94a3b8; font-size: 0.95rem; margin-top: 4px; }

    /* Controls Bar: Search & Admin Link */
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 8px;
      border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.95rem;
    }
    .admin-link-btn {
      background: #e11d48; color: white; padding: 10px 15px; border-radius: 8px;
      text-decoration: none; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 5px;
    }

    /* Games Cards Grid */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .game-card { 
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; 
      padding: 16px; position: relative; display: flex; flex-direction: column; 
      justify-content: space-between; transition: transform 0.2s;
    }
    .game-card:hover { transform: translateY(-3px); }
    .game-card h3 { color: #f1f5f9; margin-bottom: 8px; font-size: 1.1rem; width: 85%; }
    
    /* 3 Dots Menu */
    .menu-btn { 
      position: absolute; top: 12px; right: 12px; background: none; 
      border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; padding: 2px 8px;
    }
    .menu-btn:hover { color: #fff; }
    
    .dropdown-menu { 
      display: none; position: absolute; top: 45px; right: 12px; 
      background: #020617; border: 1px solid #334155; border-radius: 8px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 10; width: 160px;
    }
    .dropdown-menu button { 
      background: none; border: none; color: #38bdf8; padding: 10px 12px; 
      width: 100%; text-align: left; cursor: pointer; font-size: 0.85rem; font-weight: 600; 
    }
    .dropdown-menu button:hover { background: #1e293b; }

    /* Actions Bottom */
    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
    .like-btn { 
      background: #334155; color: #f8fafc; border: none; padding: 6px 12px; 
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 5px;
    }
    .like-btn:hover { background: #475569; }
    .play-btn { 
      background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; 
      border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; 
    }

    /* Publish Game / Submit Idea Section */
    .publish-section {
      margin-top: 40px; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;
    }
    .publish-section h2 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 8px; }
    .publish-section p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; }
    .publish-input {
      width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155;
      color: #fff; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem;
    }
    .publish-textarea {
      width: 100%; height: 80px; background: #0f172a; border: 1px solid #334155;
      color: #fff; padding: 10px; border-radius: 8px; resize: none; margin-bottom: 12px; font-size: 0.9rem;
    }
    .submit-request-btn {
      background: #22c55e; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .submit-request-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>AIT Play 🎮</h1>
    <p>Free Online Games Platform</p>
  </header>

  <!-- Search Bar & Admin AI Link -->
  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-box" placeholder="Search games..." onkeyup="filterGames()">
    <a href="admin.html" class="admin-link-btn">🤖 Admin & AI Monitor</a>
  </div>

  <!-- Games Grid -->
  <div class="games-grid" id="gamesContainer">
    <p>Loading Games...</p>
  </div>

  <!-- Publish Game Request / Idea Section -->
  <div class="publish-section">
    <h2>🚀 Publish Game Request</h2>
    <p>Submit your game name or idea. Our team will review and publish it!</p>
    <input type="text" id="userNameInput" class="publish-input" placeholder="Your Name">
    <textarea id="gameIdeaText" class="publish-textarea" placeholder="Enter Game Title & Description / Idea..."></textarea>
    <button class="submit-request-btn" id="submitBtn" onclick="submitGameRequest()">
      <span id="btnText">Send Request 🚀</span>
    </button>
  </div>

  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // Firebase Config (API Key മാറ്റി നൽകാനുള്ള സൗകര്യം)
    const firebaseConfig = {
      apiKey: "AQ.Ab8RN6KmCXeexM-JH-N_yNsBTdhKEVgpeE7J4QlffD8g-sg-mA",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // PWA Install Prompt (Three dots വഴി ഇൻസ്റ്റാൾ ചെയ്യാൻ)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      } else {
        alert("ഹോം സ്ക്രീനിലേക്ക് ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്യാൻ ബ്രൗസർ മെനുവിൽ നിന്ന് 'Add to Home Screen' അമർത്തുക!");
      }
    }

    let allGames = [];

    // Load Games from Firestore
    function loadGames() {
      const container = document.getElementById('gamesContainer');
      db.collection("published_games").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        container.innerHTML = '';
        allGames = [];
        if (snapshot.empty) {
          container.innerHTML = "<p>No games available right now!</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const game = { id: doc.id, ...doc.data() };
          allGames.push(game);
        });
        renderGames(allGames);
      });
    }

    // Render Cards with Three-Dots Menu and Like Button
    function renderGames(gamesList) {
      const container = document.getElementById('gamesContainer');
      container.innerHTML = '';
      gamesList.forEach((game) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <button class="menu-btn" onclick="toggleMenu('${game.id}')">⋮</button>
          <div class="dropdown-menu" id="menu-${game.id}">
            <button onclick="triggerInstall()">📥 Install App</button>
          </div>
          <h3>${game.title}</h3>
          <div class="card-actions">
            <button class="like-btn" onclick="likeGame('${game.id}', ${game.likes || 0})">
              ❤️ <span>${game.likes || 0}</span>
            </button>
            <button class="play-btn" onclick="playGame('${game.id}')">Play Now 🚀</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleMenu(id) {
      const menu = document.getElementById(`menu-${id}`);
      const allMenus = document.querySelectorAll('.dropdown-menu');
      allMenus.forEach(m => { if (m !== menu) m.style.display = 'none'; });
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allGames.filter(g => g.title.toLowerCase().includes(query));
      renderGames(filtered);
    }

    function likeGame(id, currentLikes) {
      db.collection("published_games").doc(id).update({
        likes: currentLikes + 1
      });
    }

    function playGame(id) {
      window.location.href = `play.html?id=${id}`;
    }

    // Game Request / Publish Idea Functionality with Loading State
    function submitGameRequest() {
      const name = document.getElementById('userNameInput').value.trim();
      const idea = document.getElementById('gameIdeaText').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      if (!name || !idea) {
        alert("ദയവായി നിങ്ങളുടെ പേരും ഗെയിം റിക്വസ്റ്റും നൽകുക!");
        return;
      }

      // Show Loading State
      submitBtn.disabled = true;
      btnText.innerText = "Sending Request... ⏳";

      db.collection("game_requests").add({
        userName: name,
        idea: idea,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("നിങ്ങളുടെ ഗെയിം റിക്വസ്റ്റ് വിജയകരമായി സമർപ്പിച്ചു! 🎉");
        document.getElementById('userNameInput').value = '';
        document.getElementById('gameIdeaText').value = '';
      }).catch((error) => {
        alert("Error sending request: " + error.message);
      }).finally(() => {
        submitBtn.disabled = false;
        btnText.innerText = "Send Request 🚀";
      });
    }

    loadGames();
  </script>
</body>
</html>
