<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIT Play - Online Games</title>
  
  <!-- Google Analytics Tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCB4FLWWTK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZCB4FLWWTK');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
    
    header { text-align: center; margin-top: 10px; margin-bottom: 20px; }
    header h1 { color: #38bdf8; font-size: 2rem; font-weight: 800; }
    header p { color: #94a3b8; font-size: 0.9rem; margin-top: 4px; }

    /* Compact Notification-style Top Banner */
    .app-banner-toast { 
      position: sticky;
      top: 10px;
      z-index: 1000;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid #38bdf8;
      backdrop-filter: blur(8px);
      padding: 8px 12px 8px 16px; 
      border-radius: 25px; 
      display: none; /* Controlled via JavaScript */
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-left span { 
      font-size: 0.85rem; 
      color: #f8fafc;
      font-weight: 500;
    }

    .banner-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-btn { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 5px 12px; 
      border-radius: 15px; 
      font-size: 0.8rem;
      font-weight: bold; 
      cursor: pointer; 
      white-space: nowrap;
      transition: background 0.2s;
    }

    .banner-btn:hover {
      background: #0284c7;
      color: #fff;
    }

    /* Close Button (✕) */
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Games Cards Grid */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    
    .game-card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 12px; 
      padding: 16px; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .game-card:hover { transform: translateY(-3px); }
    .game-card h3 { color: #f1f5f9; margin-bottom: 12px; font-size: 1.1rem; width: 85%; }
    
    /* 3 Dots Menu */
    .menu-btn { 
      position: absolute; 
      top: 12px; 
      right: 12px; 
      background: none; 
      border: none; 
      color: #94a3b8; 
      font-size: 1.4rem; 
      cursor: pointer; 
      padding: 2px 8px; 
      border-radius: 4px;
    }
    .menu-btn:hover { background: #334155; color: #fff; }
    
    .dropdown-menu { 
      display: none; 
      position: absolute; 
      top: 45px; 
      right: 12px; 
      background: #020617; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
      z-index: 10; 
      width: 140px;
    }
    .dropdown-menu button { 
      background: none; 
      border: none; 
      color: #38bdf8; 
      padding: 10px 12px; 
      width: 100%; 
      text-align: left; 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: 600; 
    }
    .dropdown-menu button:hover { background: #1e293b; }

    .play-btn { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 10px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
      margin-top: 12px; 
      text-decoration: none; 
      display: block; 
    }
  </style>
</head>
<body>

  <!-- Small Notification Style Banner with Close Button -->
  <div class="app-banner-toast" id="appBanner">
    <div class="banner-left">
      <span>📲 Get AIT Play App</span>
    </div>
    <div class="banner-right">
      <button class="banner-btn" id="installAppBtn">Get App</button>
      <button class="close-btn" id="closeBannerBtn" title="Close">✕</button>
    </div>
  </div>

  <header>
    <h1>AIT Play 🎮</h1>
    <p>Free Online Games Platform</p>
  </header>

  <div class="games-grid" id="gamesContainer">
    <p>Loading Games...</p>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCXMAdXRsyubfJFZRUoXYoYjBWjBZd7VxE",
      authDomain: "ait-game-store.firebaseapp.com",
      projectId: "ait-game-store",
      storageBucket: "ait-game-store.firebasestorage.app",
      messagingSenderId: "146438462272",
      appId: "1:146438462272:web:92a9cea7d1383f650d78a5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Direct APK Download URL (തൽക്കാലം # ആണ്, ഡൗൺലോഡ് ലിങ്ക് ലഭിക്കുമ്പോൾ കൊടുക്കാം)
    const apkDownloadUrl = "#"; 

    // Banner Logic Controls
    const banner = document.getElementById('appBanner');
    const isInstalled = localStorage.getItem('ait_app_installed');
    const isInsideApp = navigator.userAgent.includes('wv') || window.matchMedia('(display-mode: standalone)').matches;

    let autoHideTimer = null;
    let autoReopenTimer = null;

    function showBanner() {
      // ആപ്പ് ഇൻസ്റ്റാൾ ചെയ്തവർക്കോ ആപ്പിനുള്ളിൽ നിൽക്കുന്നവർക്കോ കാണിക്കില്ല
      if (isInstalled === 'true' || isInsideApp) {
        banner.style.display = 'none';
        return;
      }

      banner.style.display = 'flex';

      // 1 മിനിറ്റ് നിൽക്കും (60,000 ms)
      autoHideTimer = setTimeout(() => {
        hideBannerAndSchedule();
      }, 60000);
    }

    function hideBannerAndSchedule() {
      banner.style.display = 'none';
      if (autoHideTimer) clearTimeout(autoHideTimer);

      // 5 മിനിറ്റ് കഴിഞ്ഞു വീണ്ടും വരും (300,000 ms)
      autoReopenTimer = setTimeout(() => {
        showBanner();
      }, 300000);
    }

    // പേജ് ലോഡാകുമ്പോൾ ബാനർ സ്റ്റാർട്ട് ചെയ്യും
    showBanner();

    // '✕' ബട്ടൺ ഞെക്കുമ്പോൾ
    document.getElementById('closeBannerBtn').onclick = () => {
      hideBannerAndSchedule();
    };

    // 'Get App' ബട്ടൺ ഞെക്കുമ്പോൾ
    document.getElementById('installAppBtn').onclick = () => {
      localStorage.setItem('ait_app_installed', 'true');
      banner.style.display = 'none';
      if (autoHideTimer) clearTimeout(autoHideTimer);
      if (autoReopenTimer) clearTimeout(autoReopenTimer);

      if (apkDownloadUrl !== "#") {
        window.location.href = apkDownloadUrl;
      } else {
        alert("Downloading AIT Play App...");
      }
    };

    // Firebase-ൽ നിന്ന് ഗെയിമുകൾ ലോഡ് ചെയ്യാനുള്ള ഫങ്ഷൻ
    function loadGames() {
      const container = document.getElementById('gamesContainer');
      db.collection("published_games").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = "<p>No games available right now!</p>";
          return;
        }
        snapshot.forEach((doc) => {
          const game = doc.data();
          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <button class="menu-btn" onclick="toggleMenu('${doc.id}')">⋮</button>
            <div class="dropdown-menu" id="menu-${doc.id}">
              <button onclick="installGame('${game.title}')">📥 Install Game</button>
            </div>
            <h3>${game.title}</h3>
            <button class="play-btn" onclick="playGame('${doc.id}')">Play Now 🚀</button>
          `;
          container.appendChild(card);
        });
      });
    }

    function toggleMenu(id) {
      const menu = document.getElementById(`menu-${id}`);
      const allMenus = document.querySelectorAll('.dropdown-menu');
      allMenus.forEach(m => { if (m !== menu) m.style.display = 'none'; });
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function installGame(title) {
      alert(`"${title}" ഇൻസ്റ്റാൾ ചെയ്യാൻ മുകളിലുള്ള 'Get App' ബട്ടൺ ഉപയോഗിക്കുക.`);
    }

    function playGame(id) {
      window.location.href = `play.html?id=${id}`;
    }

    // ഗെയിമുകൾ ലോഡ് ചെയ്യുന്നു
    loadGames();
  </script>
</body>
</html>
